<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soundtrack · Dikshya's World</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="floaties" id="floaties" aria-hidden="true"></div>
<div class="nav-overlay hidden" id="navOverlay"></div>
<button class="hamburger-btn" id="hamburgerBtn" aria-label="Open menu">☰</button>

<div class="app-shell">
  <aside class="sidebar">
    <a href="index.html" class="brand">Dikshya's World<span>a digital sanctuary</span></a>
    <nav aria-label="Main navigation"><ul class="nav-list" id="sidebarNavList"></ul></nav>
    <div class="sidebar-foot">
      <p>“songs that feel like me ♡”</p>
      <button class="btn btn-sm btn-soft" id="exportWorldBtn" style="width:100%;margin-bottom:.5rem;">⬇ Export My World</button>
      <label class="btn btn-sm btn-outline" style="width:100%;text-align:center;display:block;cursor:pointer;">⬆ Import My World
        <input type="file" id="importWorldInput" accept="application/json" class="sr-only">
      </label>
    </div>
  </aside>

  <main class="page-content">
    <header class="page-header">
      <span class="eyebrow">my soundtrack</span>
      <h1>🎵 songs for every version of me</h1>
      <p>this song reminds me of… a personal collection, not a streaming library.</p>
    </header>

    <section class="section">
      <div class="paper-card">
        <h3 style="margin-top:0;">add a song</h3>
        <div class="grid grid-2">
          <div>
            <label for="songTitle">song title</label>
            <input type="text" id="songTitle" placeholder="e.g. champagne problems">
            <label for="songArtist">artist</label>
            <input type="text" id="songArtist" placeholder="e.g. Taylor Swift">
            <label for="songCategory">category</label>
            <select id="songCategory">
              <option>songs that feel like me</option>
              <option>current obsession</option>
              <option>comfort songs</option>
              <option>main character songs</option>
              <option>songs attached to memories</option>
              <option>songs for crying</option>
              <option>songs for getting my life together</option>
              <option>songs for romanticizing life</option>
            </select>
          </div>
          <div>
            <label for="songNote">personal note / memory</label>
            <textarea id="songNote" placeholder="this song reminds me of…" style="min-height:70px;"></textarea>
            <label for="songSpotify">Spotify URL (optional)</label>
            <input type="url" id="songSpotify" placeholder="https://open.spotify.com/...">
            <label for="songYoutube">YouTube URL (optional)</label>
            <input type="url" id="songYoutube" placeholder="https://youtube.com/...">
          </div>
        </div>
        <button class="btn btn-primary" id="addSongBtn">🎵 add to my soundtrack</button>
      </div>
    </section>

    <section class="section">
      <div class="archive-toolbar paper-card">
        <div style="flex:1;min-width:200px;">
          <label for="songSearch">search</label>
          <input type="text" id="songSearch" placeholder="search title, artist or note…">
        </div>
        <div>
          <label for="songCategoryFilter">category</label>
          <select id="songCategoryFilter"><option value="">all categories</option></select>
        </div>
      </div>
      <div id="musicList" class="grid grid-3"></div>
      <p class="empty-state" id="musicEmptyState" style="display:none;">no songs yet — add the first one to your soundtrack ♡</p>
    </section>
  </main>
</div>

<nav class="bottom-nav" id="bottomNavList" aria-label="Mobile navigation"></nav>

<script src="js/storage.js"></script>
<script src="js/app.js"></script>
<script src="js/music.js"></script>
</body>
</html>
